{% extends "base.html" %}

{% block title %}{{ code }} — {{ title }} | FoodFresh AI{% endblock %}

{% block content %}
<section class="section-sm">
  <div class="container" style="max-width: 560px; text-align: center;">
    <div class="card card-xl">
      <div style="font-size:4rem;font-weight:800;color:var(--color-primary);margin-bottom:0.5rem;">
        {{ code }}
      </div>
      <h1 style="font-size:1.5rem;">{{ title }}</h1>
      <p class="text-muted">{{ detail }}</p>
      <div class="flex-center flex-gap" style="justify-content:center; margin-top:1.5rem; flex-wrap:wrap;">
        <a href="{{ url_for('main.landing') }}" class="btn btn-primary">
          <i class="fas fa-home"></i> Return Home
        </a>
        <a href="{{ url_for('prediction.dashboard') }}" class="btn btn-outline">
          <i class="fas fa-tachometer-alt"></i> Dashboard
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
